<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broke & Young</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/index.css" />
    <script src="js/general.js" defer></script>
    <script src="js/index.js" defer></script>
  </head>
  <body>
    <header class="flex">
      <button class="burger">
        <img src="img/menu.svg" alt="Menu knap" />
      </button>
      <nav class="menu">
        <button class="close_menu">
          <img src="img/close_menu.svg" alt="Luk menu" />
        </button>
        <div class="menu_insert"></div>
      </nav>
      <a href="index.html">
        <picture>
          <source srcset="img/logo_small.svg" media="(max-width: 425px)" />
          <img src="img/logo.svg" />
        </picture>
      </a>
      <img src="img/search.svg" alt="Søgefelt" class="search" />
      <div class="overlay"></div>
    </header>
    <main>
      <section class="hero">
        <img
          src="img/hero1.svg"
          alt="Hero illustration 1"
          class="hero_img img1"
        />
        <img
          src="img/hero2.svg"
          alt="Hero illustration 2"
          class="hero_img img2"
        />
        <a href="#cuisines" class="button button_start">Find opskrifter</a>
      </section>
      <div class="max_width">
        <section class="sec sec2" id="cuisines">
          <h2>Vælg køkken</h2>
          <div class="grid_1_1_1_1"></div>
        </section>
      </div>
    </main>
    <footer></footer>
  </body>
</html>
