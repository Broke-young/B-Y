<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
    <title>List</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/general.css" />
    <link rel="stylesheet" href="css/list.css" />
    <script src="js/general.js" defer></script>
    <script src="js/list.js" defer></script>
  </head>
  <body>
    <header class="flex">
      <button class="burger">
        <img src="img/menu.svg" alt="Menu knap" />
      </button>
      <nav class="menu">
        <button class="close_menu">
          <img src="img/close_menu.svg" alt="Luk menu" />
        </button>
        <div class="menu_insert"></div>
      </nav>
      <a href="index.html">
        <picture>
          <source
            srcset="img/logo_small.svg"
            media="(max-width: 425px)"
            alt="Broke and Young"
          />
          <img src="img/logo.svg" alt="Broke and Young" />
        </picture>
      </a>
      <img src="img/search.svg" alt="Søgefelt" class="search" />
      <div class="overlay"></div>
    </header>

    <div class="max_width">
      <div id="dynamic-header"></div>
      <section id="controls">
        <div id="sorter">
          <span>Sorter efter:</span>
          <button class="sort-btn" data-sort="az">A-Z</button>
          <button class="sort-btn" data-sort="za">Z-A</button>
        </div>
        <div id="filter">
          <span>Sværhedsgrad:</span>
          <button class="filter-btn" data-diff="Easy">Easy</button>
          <button class="filter-btn" data-diff="Medium">Medium</button>
          <button class="filter-btn" data-diff="all">All</button>
        </div>
      </section>

      <main class="productlist-grid"></main>
    </div>
    <footer class="flex">
      <section>
        <div class="footer_click">
          <img src="img/cookie.svg" alt="Cookies" />
          <p class="footer_text">Cookies</p>
        </div>
        <div class="footer_click">
          <img src="img/mail.svg" alt="Mail" />
          <p class="footer_text">Broke@young.dk</p>
        </div>
      </section>
      <picture class="footer_logo">
        <source
          srcset="img/logo_small.svg"
          media="(max-width: 425px)"
          alt="Broke and Young"
        />
        <img src="img/logo.svg" alt="Broke and Young" />
      </picture>
    </footer>
  </body>
</html>
